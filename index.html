<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Soyoung Kim, Ph.D.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #192d35;
      --muted: #607078;
      --line: #dce5e7;
      --teal: #087278;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      color: var(--ink);
      font-family: "Poppins", Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      width: 100%;
      height: 80px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    nav {
      width: min(1120px, 92%);
      height: 80px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-name {
      color: #123f4d;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .menu {
      display: flex;
      gap: 30px;
    }

    .menu a {
      color: #42565d;
      font-size: 15px;
      font-weight: 500;
    }

    .menu a:hover,
    .menu .active {
      color: var(--teal);
      font-weight: 700;
    }

    main {
      flex: 1;
      width: min(1180px, 92%);
      margin: 0 auto;
      padding: 34px 0 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero-title {
      max-width: 850px;
      margin: 0 0 24px;
      color: var(--ink);
      text-align: center;
      font-size: clamp(21px, 2.2vw, 30px);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.35;
    }

    .hero-subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .hero-image {
      width: 100%;
      max-width: 1180px;
      max-height: calc(100vh - 275px);
      display: block;
      object-fit: contain;
    }

    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    footer div {
      width: min(1120px, 92%);
      margin: 0 auto;
      padding: 24px 0;
    }

    @media (max-width: 650px) {
      header,
      nav {
        height: auto;
      }

      nav {
        padding: 18px 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .menu {
        gap: 18px;
        flex-wrap: wrap;
      }

      main {
        width: min(100%, 92%);
        padding: 38px 0 32px;
      }

      .hero-title {
        margin-bottom: 18px;
        font-size: 22px;
      }

      .hero-subtitle {
        margin-bottom: 24px;
        font-size: 13px;
      }

      .hero-image {
        max-height: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a class="site-name" href="index.html">SOYOUNG KIM, Ph.D.</a>

      <div class="menu">
        <a class="active" href="index.html">Home</a>
        <a href="soyoung.html">Soyoung</a>
        <a href="research.html">Research</a>
        <a href="achievement.html">Achievement</a>
      </div>
    </nav>
  </header>

  <main>
    <h1 class="hero-title">
      Engineering Materials and Flow Systems<br>
      for a Cleaner Water–Energy Future.
    </h1>

    <p class="hero-subtitle">
      Functional materials and electrochemical flow systems for sustainable infrastructure.
    </p>

    <img class="hero-image"
         src="assets/images/art2.jpg"
         alt="Functional materials, water treatment, resource recovery, and sustainable energy illustration">
  </main>

  <footer>
    <div>© 2026 Soyoung Kim</div>
  </footer>
</body>
</html>
