<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Soyoung Kim, Ph.D.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --teal: #087278;
      --line: #dce5e7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #ffffff;
      font-family: "Poppins", sans-serif;
    }

    header {
      width: 100%;
      height: 80px;
      border-bottom: 1px solid var(--line);
      background-color: #ffffff;
    }

    nav {
      width: min(1120px, 92%);
      height: 80px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .site-name {
      color: #123f4d;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .menu {
      display: flex;
      gap: 30px;
    }

    .menu a {
      color: #42565d;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .menu a:hover,
    .menu .active {
      color: var(--teal);
      font-weight: 700;
    }

    .hero {
      min-height: calc(100vh - 80px);
      padding: 42px 4%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero img {
      width: min(1180px, 100%);
      max-height: calc(100vh - 164px);
      display: block;
      object-fit: contain;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 600px) {
      header,
      nav {
        height: auto;
      }

      nav {
        padding: 18px 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .menu {
        gap: 18px;
        flex-wrap: wrap;
      }

      .hero {
        min-height: auto;
        padding: 42px 5%;
      }

      .hero img {
        max-height: none;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a class="site-name" href="index.html">SOYOUNG KIM, Ph.D.</a>

      <div class="menu">
        <a class="active" href="index.html">Home</a>
        <a href="soyoung.html">Soyoung</a>
        <a href="research.html">Research</a>
        <a href="achievement.html">Achievement</a>
      </div>
    </nav>
  </header>

  <main class="hero">
    <h1 class="sr-only">Soyoung Kim, Ph.D.</h1>

    <img src="assets/images/art2.png"
         alt="Research artwork">
  </main>
</body>
</html>
